name: Develop CI Pipeline

on:
  push:
    branches:
      - develop
    paths:
      - 'VFR3D.API/**'
      - 'VFR3D.Domain/**'
      - 'VFR3D.Infrastructure/**'
      - 'VFR3D.Azure.Functions/**'
      - 'VFR3D.Tests/**'
      - '.github/workflows/develop-ci-cd.yml'

env:
  DOTNET_CORE_VERSION: 8.0.x
  CONFIGURATION: Release

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_CORE_VERSION }}

      - name: Restore
        run: dotnet restore VFR3D.Backend.sln

      - name: Build
        run: dotnet build VFR3D.Backend.sln --configuration ${{ env.CONFIGURATION }} --no-restore

      - name: Test
        run: dotnet test VFR3D.Tests/VFR3D.Tests.csproj --configuration ${{ env.CONFIGURATION }} --no-build --verbosity normal

      - name: Verify Docker build
        run: docker build -t vfr3d-api-test .
