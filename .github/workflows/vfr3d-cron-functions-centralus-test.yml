name: Build and deploy .NET Core application to Function App vfr3d-cron-functions-centralus-test
on:
  push:
    branches:
    - feature/converting-to-azure-functions
env:
  AZURE_FUNCTIONAPP_NAME: vfr3d-cron-functions-centralus-test
  AZURE_FUNCTIONAPP_PACKAGE_PATH: VFR3D.Azure.Functions/published
  CONFIGURATION: Release
  DOTNET_CORE_VERSION: 8.0.x
  WORKING_DIRECTORY: VFR3D.Azure.Functions
  DOTNET_CORE_VERSION_INPROC: 6.0.x
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_CORE_VERSION }}
    - name: Setup .NET Core (for inproc extensions)
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_CORE_VERSION_INPROC }}
    - name: Restore
      run: dotnet restore "${{ env.WORKING_DIRECTORY }}"
    - name: Build
      run: dotnet build "${{ env.WORKING_DIRECTORY }}" --configuration ${{ env.CONFIGURATION }} --no-restore
    - name: Publish
      # Use specific flags for Azure Functions
      run: dotnet publish "${{ env.WORKING_DIRECTORY }}" --configuration ${{ env.CONFIGURATION }} --output "${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}" --no-build
    # Verify the package content
    - name: List published files
      run: |
        echo "Published files:"
        ls -la "${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}"
        echo "Checking for .azurefunctions directory:"
        find "${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}" -name ".azurefunctions" -type d || echo "Not found"
    - name: Publish Artifacts
      uses: actions/upload-artifact@v4
      with:
        name: functionapp
        path: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Download artifact from build job
      uses: actions/download-artifact@v4
      with:
        name: functionapp
        path: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
    # Verify the downloaded artifacts
    - name: List downloaded files
      run: |
        echo "Downloaded files:"
        ls -la "${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}"
    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.vfr3d_cron_functions_centralus_test_SPN }}
    - name: Deploy to Azure Function App
      uses: Azure/functions-action@v1
      with:
        app-name: ${{ env.AZURE_FUNCTIONAPP_NAME }}
        package: ${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}
        # Add this flag to force the correct deployment
        respect-funcignore: true