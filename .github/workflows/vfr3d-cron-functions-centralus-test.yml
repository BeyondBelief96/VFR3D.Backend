name: Build and deploy .NET Core application to Function App vfr3d-cron-functions-centralus-test
on:
  push:
    branches:
    - feature/converting-to-azure-functions
env:
  AZURE_FUNCTIONAPP_NAME: vfr3d-cron-functions-centralus-test
  AZURE_FUNCTIONAPP_PACKAGE_PATH: VFR3D.Azure.Functions/published
  CONFIGURATION: Release
  DOTNET_CORE_VERSION: 8.0.x
  WORKING_DIRECTORY: VFR3D.Azure.Functions
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
    - uses: actions/checkout@v4
    
    - name: Setup .NET SDK
      uses: actions/setup-dotnet@v4
      with:
        dotnet-version: ${{ env.DOTNET_CORE_VERSION }}
    
    - name: Restore
      run: dotnet restore "${{ env.WORKING_DIRECTORY }}"
    
    - name: Build
      run: dotnet build "${{ env.WORKING_DIRECTORY }}" --configuration ${{ env.CONFIGURATION }} --no-restore
    
    - name: Publish
      run: dotnet publish "${{ env.WORKING_DIRECTORY }}" --configuration ${{ env.CONFIGURATION }} --output "${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}" --no-build
    
    - name: Create .azurefunctions directory
      run: |
        # Create .azurefunctions directory in the published output
        mkdir -p "${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}/.azurefunctions"
        # Create an empty file to ensure the directory is included in the zip
        echo "{}" > "${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}/.azurefunctions/functionsmetadata"
        
        # Verify the directory was created
        echo "Checking for .azurefunctions directory:"
        ls -la "${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}/.azurefunctions"
    
    - name: Create deployment zip
      run: |
        cd "${{ env.AZURE_FUNCTIONAPP_PACKAGE_PATH }}"
        zip -r ../../functionapp.zip .
        cd ../..
        # Verify the zip was created successfully
        ls -la functionapp.zip
    
    - name: Upload deployment zip
      uses: actions/upload-artifact@v4
      with:
        name: functionapp-zip
        path: functionapp.zip
  
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
    - name: Download deployment zip
      uses: actions/download-artifact@v4
      with:
        name: functionapp-zip
        path: .
    
    - name: Verify downloaded zip
      run: ls -la functionapp.zip
    
    - name: Azure Login
      uses: azure/login@v2
      with:
        creds: ${{ secrets.azapp_service_principal_test }}
    
    - name: Deploy with Azure CLI
      run: |
        echo "Deploying to Function App: ${{ env.AZURE_FUNCTIONAPP_NAME }}"
        az functionapp deployment source config-zip \
          --resource-group rg-vfr3d-centralus-test \
          --name ${{ env.AZURE_FUNCTIONAPP_NAME }} \
          --src functionapp.zip
    
    - name: Verify deployment
      run: |
        echo "Deployment completed. Waiting for function app to start..."
        sleep 30
        echo "Fetching function list:"
        az functionapp function list \
          --resource-group rg-vfr3d-centralus-test \
          --name ${{ env.AZURE_FUNCTIONAPP_NAME }} \
          --output table