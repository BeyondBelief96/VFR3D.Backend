name: Build and deploy VFR3D API Azure
on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/azapp-vfr3d-api-centralus-test.yml'
      - 'VFR3D.API/**'
      - 'VFR3D.Domain/**'
      - 'VFR3D.Infrastructure/**'
      - 'VFR3D.Common/**'
env:
  AZURE_WEBAPP_NAME: azapp-vfr3d-api-centralus-test
  DOTNET_CORE_VERSION: 8.0.x
  WORKING_DIRECTORY: VFR3D.API
  TEST_PROJECT: VFR3D.Tests
  CONFIGURATION: Release
  PUBLISH_DIR: ./publish-output
jobs:
  build:
    runs-on: ubuntu-latest
    services:
      docker:
        image: docker:20.10.7
        options: --privileged
        ports:
          - 5432:5432
    steps:
      - uses: actions/checkout@v4
      
      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_CORE_VERSION }}
      
      - name: Restore API project
        run: dotnet restore "${{ env.WORKING_DIRECTORY }}"
      
      - name: Restore Test project
        run: dotnet restore "${{ env.TEST_PROJECT }}"
        continue-on-error: true
      
      - name: Build Test project
        run: dotnet build "${{ env.TEST_PROJECT }}" --configuration ${{ env.CONFIGURATION }} --no-restore
        continue-on-error: true
      
      - name: Run Tests
        run: dotnet test "${{ env.TEST_PROJECT }}" --configuration ${{ env.CONFIGURATION }} --no-build
        continue-on-error: true
      
      - name: Build and Publish API
        run: |
          mkdir -p "${{ env.PUBLISH_DIR }}"
          dotnet publish "${{ env.WORKING_DIRECTORY }}" --configuration ${{ env.CONFIGURATION }} --output "${{ env.PUBLISH_DIR }}"
          echo "Published files:"
          ls -la "${{ env.PUBLISH_DIR }}"
      
      - name: Publish Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: vfr3d-api
          path: ${{ env.PUBLISH_DIR }}
          if-no-files-found: error
  
  deploy:
    runs-on: ubuntu-latest
    needs: build
    steps:
      - name: Download artifact from build job
        uses: actions/download-artifact@v4
        with:
          name: vfr3d-api
          path: ${{ env.PUBLISH_DIR }}
      
      - name: List downloaded files
        run: |
          ls -la "${{ env.PUBLISH_DIR }}"
      
      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.azapp_service_principal_test }}
      
      - name: Deploy to Azure WebApp
        uses: azure/webapps-deploy@v2
        with:
          app-name: ${{ env.AZURE_WEBAPP_NAME }}
          package: ${{ env.PUBLISH_DIR }}
      
      - name: Restart Azure WebApp
        run: |
          az webapp restart --name ${{ env.AZURE_WEBAPP_NAME }} --resource-group rg-vfr3d-centralus-test