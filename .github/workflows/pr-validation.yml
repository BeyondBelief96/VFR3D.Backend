name: PR Validation

on:
  pull_request:
    branches: [develop, main]
    paths:
      - 'VFR3D.API/**'
      - 'VFR3D.Domain/**'
      - 'VFR3D.Infrastructure/**'
      - 'VFR3D.Common/**'
      - 'VFR3D.Azure.Functions/**'
      - 'VFR3D.Tests/**'
      - '.github/workflows/pr-validation.yml'

env:
  DOTNET_CORE_VERSION: 8.0.x
  CONFIGURATION: Release

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET SDK
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_CORE_VERSION }}

      - name: Restore solution
        run: dotnet restore VFR3D.Backend.sln

      - name: Build solution
        run: dotnet build VFR3D.Backend.sln --configuration ${{ env.CONFIGURATION }} --no-restore

      - name: Run tests
        run: dotnet test VFR3D.Tests/VFR3D.Tests.csproj --configuration ${{ env.CONFIGURATION }} --no-build --verbosity normal
