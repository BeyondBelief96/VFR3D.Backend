services:
  db:
    image: postgis/postgis:15-3.3
    container_name: vfr3d-db
    environment:
      - POSTGRES_USER=vfr3d_development_user
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=vfr3d_development_database
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vfr3d_development_user -d vfr3d_development_database"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.local
    container_name: vfr3d-web-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DOTNET_RUNNING_IN_CONTAINER=true
      # Database Settings
      - Database__Host=db
      - Database__Database=vfr3d_development_database
      - Database__Username=vfr3d_development_user
      - Database__Password=${DB_PASSWORD}
      - Database__Port=5432
      # Azure Blob Storage Settings
      - CloudStorage__ConnectionString=${CLOUD_STORAGE_CONNECTION_STRING}
      - CloudStorage__UseManagedIdentity=false
      # Stripe Settings
      - StripeSettings__StripeSecretKey=${STRIPE_SECRET_KEY}
      - StripeSettings__StripeMonthlySubscriptionPriceId=price_1PpMqiDdx3lXaRF7yPMTYOMW
      - StripeSettings__Domain=https://localhost:7014
      # Auth0 Settings
      - Auth0Settings__Auth0ApiIdentifier=testAuth0ApiIdentifier
      - Auth0Settings__Auth0Domain=testAuth0Domain
      - Auth0Settings__RequireAuthenticationInDevelopment=false
      # Preflight API Settings
      - PreflightApi__BaseUrl=${PREFLIGHT_API_BASE_URL:-http://localhost:5000}
      - PreflightApi__ApiKey=${PREFLIGHT_API_KEY}
    ports:
      - "7014:80"
    volumes:
      - .:/app
      - /app/VFR3D.Domain/bin
      - /app/VFR3D.Domain/obj
      - /app/VFR3D.Infrastructure/bin
      - /app/VFR3D.Infrastructure/obj
      - /app/VFR3D.API/bin
      - /app/VFR3D.API/obj
      - /app/VFR3D.Tests/bin
      - /app/VFR3D.Tests/obj
    command: >
      sh -c "find . -type d -name 'obj' -exec rm -rf {} + 2>/dev/null || true &&
             dotnet restore &&
             dotnet ef database update --project VFR3D.Infrastructure --startup-project VFR3D.API --connection 'Host=db;Database=vfr3d_development_database;Username=vfr3d_development_user;Password=${DB_PASSWORD};Port=5432' &&
             dotnet watch --project VFR3D.API run --urls=http://0.0.0.0:80"
volumes:
  postgres_data:
