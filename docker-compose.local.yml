services:
  db:
    image: postgis/postgis:15-3.3
    container_name: vfr3d-db
    environment:
      - POSTGRES_USER=vfr3d_development_user
      - POSTGRES_PASSWORD=${DB_PASSWORD}
      - POSTGRES_DB=vfr3d_development_database
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vfr3d_development_user -d vfr3d_development_database"]
      interval: 5s
      timeout: 5s
      retries: 5

  azurite:
    image: mcr.microsoft.com/azure-storage/azurite
    container_name: vfr3d-azurite
    ports:
      - "10000:10000"
      - "10001:10001"
      - "10002:10002"
    volumes:
      - azurite_data:/data
    command: "azurite --blobHost 0.0.0.0 --queueHost 0.0.0.0 --tableHost 0.0.0.0 --loose"

  api:
    build:
      context: .
      dockerfile: Dockerfile.local
    container_name: vfr3d-web-api
    depends_on:
      db:
        condition: service_healthy
      azurite:
        condition: service_started
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DOTNET_RUNNING_IN_CONTAINER=true
      # Database Settings
      - Database__Host=db
      - Database__Database=vfr3d_development_database
      - Database__Username=vfr3d_development_user
      - Database__Password=${DB_PASSWORD}
      - Database__Port=5432
