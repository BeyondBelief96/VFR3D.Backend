services:
  db:
    image: postgis/postgis:15-3.3
    container_name: vfr3d-db
    environment:
      - POSTGRES_USER=vfr3d_development_user
      - POSTGRES_PASSWORD=localdevpassword
      - POSTGRES_DB=vfr3d_development_database
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vfr3d_development_user -d vfr3d_development_database"]
      interval: 5s
      timeout: 5s
      retries: 5

  api:
    build:
      context: .
      dockerfile: Dockerfile.local
    container_name: vfr3d-web-api
    depends_on:
      db:
        condition: service_healthy
    environment:
      - ASPNETCORE_ENVIRONMENT=Development
      - DOTNET_RUNNING_IN_CONTAINER=true
      # Database Settings
      - Database__Host=db
      - Database__Database=vfr3d_development_database
      - Database__Username=vfr3d_development_user
      - Database__Password=localdevpassword
      - Database__Port=5432
      # Azure Blob Storage Settings (Using real Azure Storage)
      - CloudStorage__ConnectionString=DefaultEndpointsProtocol=https;AccountName=rgvfr3dcentralustes98ad;AccountKey=Vt8BpD/P9XkctUpuF31zQ89R7yBAfjyJyZ+HMmQdes2H1G/Xo0+ZlMKnp/hvvguzK57tljkGSEt1+ASteklMbQ==;EndpointSuffix=core.windows.net
      - CloudStorage__ChartSupplementsContainerName=vfr3d-chart-supplements-centralus-test
      - CloudStorage__AirportDiagramsContainerName=vfr3d-airport-diagrams-centralus-test
      - CloudStorage__UseManagedIdentity=false
      # Stripe Settings
      - StripeSettings__StripeSecretKey=sk_test_51PpD2EDdx3lXaRF74Y2c0ATwwxqkYEVytQlcJd0ekJI5yqZfAKYgDccTPK5FHkB3O8gRPh3XexWW8jaE0bBMwBVY00ByeCbkjD
      - StripeSettings__StripeMonthlySubscriptionPriceId=price_1PpMqiDdx3lXaRF7yPMTYOMW
      - StripeSettings__Domain=https://localhost:7014
      # NOAA API Settings
      - NOAASettings__NOAAApiKey=zNEw7
      # Auth0 Settings
      - Auth0Settings__Auth0ApiIdentifier=testAuth0ApiIdentifier
      - Auth0Settings__Auth0Domain=testAuth0Domain
      - Auth0Settings__RequireAuthenticationInDevelopment=false
    ports:
      - "7014:80"
    volumes:
      - .:/app
      - /app/VFR3D.Domain/bin
      - /app/VFR3D.Domain/obj
      - /app/VFR3D.Infrastructure/bin
      - /app/VFR3D.Infrastructure/obj
      - /app/VFR3D.API/bin
      - /app/VFR3D.API/obj
      - /app/VFR3D.Tests/bin
      - /app/VFR3D.Tests/obj
      - /app/VFR3D.Azure.Functions/bin
      - /app/VFR3D.Azure.Functions/obj
    command: >
      sh -c "find . -type d -name 'obj' -exec rm -rf {} + 2>/dev/null || true &&
             dotnet restore &&
             dotnet ef database update --project VFR3D.Infrastructure --startup-project VFR3D.API --connection 'Host=db;Database=vfr3d_development_database;Username=vfr3d_development_user;Password=localdevpassword;Port=5432' &&
             dotnet watch --project VFR3D.API run --urls=http://0.0.0.0:80"
volumes:
  postgres_data: